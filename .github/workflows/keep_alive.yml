name: Keep Render Alive

on:
  schedule:
    # Every 14 min, 10am–7pm IST (4:30–13:30 UTC), Mon–Sat
    - cron: '*/14 4-13 * * 1-6'
  workflow_dispatch: # keep manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s https://insight-engine-backend.onrender.com/health
          echo "Pinged at $(date)"